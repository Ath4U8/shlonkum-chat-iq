name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: Backup root files
        run: |
          mkdir -p /tmp/backup
          cp main.dart pubspec.yaml /tmp/backup/
          cp icon.png iraq_map.png ishtar_gate.jfif /tmp/backup/

      - name: Create Flutter structure
        run: |
          flutter create . --project-name shlonkum_chat_iq --org com.shlonkum.chat --platforms android
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/main.dart lib/main.dart
          mkdir -p assets
          cp /tmp/backup/icon.png assets/icon.png
          cp /tmp/backup/iraq_map.png assets/iraq_map.png
          cp /tmp/backup/ishtar_gate.jfif assets/ishtar_gate.jfif

      - name: Set Arabic app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="شلونكم چات - IQ"/' android/app/src/main/AndroidManifest.xml

      - name: Add INTERNET permission (required in release builds)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Fix NDK
        run: |
          sed -i 's/ndkVersion = .*/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Verify assets
        run: |
          ls -la assets/
          find android -name "ic_launcher*" | head
          grep -n "icon" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shlonkum-chat-iq-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
