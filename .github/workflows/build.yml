name: Build Flutter App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup root Dart files
        run: |
          mkdir -p /tmp/dart_backup
          cp -f *.dart /tmp/dart_backup/ 2>/dev/null || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow (PIL)
        run: python -m pip install --upgrade pip && pip install pillow

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create clean Android Flutter project and restore Dart files
        run: |
          flutter create --overwrite --platforms=android --project-name shlonkum_chat_iq .
          mkdir -p lib
          cp -f /tmp/dart_backup/*.dart lib/ 2>/dev/null || true

      - name: Update Gradle wrapper to compatible version
        run: |
          sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shlonkum-iq-apk
          path: build/app/outputs/flutter-apk/app-release.apk
