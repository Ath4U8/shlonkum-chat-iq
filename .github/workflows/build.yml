name: Build Shlonkum Chat IQ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Sync root Dart files into lib
        shell: bash
        run: |
          mkdir -p lib
          [ -f main.dart ] && cp -f main.dart lib/main.dart
          [ -f auth_screens.dart ] && cp -f auth_screens.dart lib/auth_screens.dart
          [ -f home_screens.dart ] && cp -f home_screens.dart lib/home_screens.dart
          ls -la lib

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shlonkum-chat-iq-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
