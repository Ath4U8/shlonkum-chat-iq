name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - name: Backup root files
        run: |
          mkdir -p /tmp/backup
          cp main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp icon.png /tmp/backup/icon.png || echo "no icon"
          cp iraq_map.png /tmp/backup/iraq_map.png || echo "no map"
          cp ishtar_gate.jfif /tmp/backup/ishtar_gate.jfif || echo "no ishtar"
      - name: Create Flutter structure for build only
        run: |
          flutter create . --project-name shlonkum_chat_iq --org com.shlonkum.chat --platforms android || true
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/icon.png icon.png || true
          cp /tmp/backup/iraq_map.png iraq_map.png || true
          cp /tmp/backup/ishtar_gate.jfif ishtar_gate.jfif || true
      - name: Set Arabic app name in generated Manifest only
        run: |
          sed -i 's/android:label="[^"]*"/android:label="شلونكم چات - IQ"/' android/app/src/main/AndroidManifest.xml || true
          cat android/app/src/main/AndroidManifest.xml
      - name: Get packages
        run: flutter pub get
      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons || true
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shlonkum-chat-iq-apk
          path: build/app/outputs/flutter-apk/app-release.apk
