name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17 - fixes Java 25.0.5 error
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - name: Backup root files
        run: |
          mkdir -p /tmp/backup
          cp main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp icon.png /tmp/backup/icon.png || echo "no icon"
          cp iraq_map.png /tmp/backup/iraq_map.png || echo "no map"
          cp ishtar_gate.jfif /tmp/backup/ishtar_gate.jfif || echo "no ishtar"
      - name: Create Flutter structure for build only
        run: |
          flutter create . --project-name shlonkum_chat_iq --org com.shlonkum.chat --platforms android || true
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/icon.png icon.png || true
          cp /tmp/backup/iraq_map.png iraq_map.png || true
          cp /tmp/backup/ishtar_gate.jfif ishtar_gate.jfif || true
      - name: Set Arabic app name in generated Manifest only
        run: |
          sed -i 's/android:label="[^"]*"/android:label="شلونكم چات - IQ"/' android/app/src/main/AndroidManifest.xml || true
      - name: Fix NDK version conflict - force 27.0.12077973
        run: |
          sed -i 's/ndkVersion = .*/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts || true
      - name: Install NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || true
          ls $ANDROID_HOME/ndk/ || true
      - name: Get packages
        run: flutter pub get
      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons || true
      - name: Build APK
        run: flutter build apk --release
      - name: Find APK files
        run: |
          find build -name "*.apk" || true
          find android -name "*.apk" || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shlonkum-chat-iq-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
